<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px;
      height: 100vh;
      overflow: hidden; /* only the results list scrolls; controls stay put */
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    #regex {
      flex: 1;
      max-width: 200px; /* narrower than full width */
      min-width: 100px;
      padding: 6px 8px;
      border: 1px solid #888;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
    }
    button {
      padding: 6px 12px;
      border: 1px solid #888;
      border-radius: 4px;
      background: #f0f0f0;
      cursor: pointer;
    }
    button:hover { background: #e4e4e4; }
    #refresh {
      background: #2e7d32;
      border-color: #1b5e20;
      color: #fff;
      padding: 5px 8px;
      display: flex;
      align-items: center;
    }
    #refresh:hover { background: #388e3c; }
    #clear {
      padding: 5px 8px;
      display: flex;
      align-items: center;
      color: #b00020;
    }
    #clear:hover { background: #f3d1d8; }
    #history {
      flex: 1;
      min-width: 0;
      padding: 5px 6px;
      border: 1px solid #888;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }
    label { white-space: nowrap; user-select: none; }
    #status { min-height: 18px; color: #444; flex: 1; }
    #status.error { color: #b00020; }
    button.mini {
      padding: 2px 6px;
      font-size: 11px;
      line-height: 1.4;
    }
    #results { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .result {
      display: flex;
      gap: 6px;
      align-items: baseline;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      width: 100%;
      flex-shrink: 0;
    }
    .result:hover { background: #f2f2f2; }
    .result.active { background: #ffe94a; border-color: #e0c800; }
    .result .rid { color: #888; flex-shrink: 0; }
    .result .body { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .result mark { background: #ffe94a; outline: 1px solid #e0c800; }
    #short-ctx, #ignore-case { accent-color: #4a76b8; }
  </style>
</head>
<body>
  <div class="row">
    <input id="regex" type="text" placeholder="regex, e.g. \d{4}" />
    <button id="refresh" title="Refresh search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button id="clear" title="Clear highlights and results">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="row">
    <select id="history"></select>
    <label><input type="checkbox" id="ignore-case" /> Aa</label>
    <label><input type="checkbox" id="short-ctx" /> short ctx</label>
  </div>
  <div class="row">
    <div id="status"></div>
    <button id="copy-selected" class="mini" title="Copy the full displayed text of the selected result" hidden>copy</button>
    <button id="copy-matched" class="mini" title="Copy only the matched text of the selected result" hidden>copy matched</button>
    <button id="copy-all" class="mini" title="Copy the full displayed text of all results, one per line">copy all</button>
  </div>
  <div id="results"></div>
  <script src="panel.js"></script>
</body>
</html>
